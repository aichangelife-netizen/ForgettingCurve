[project]
name = "forgetting-curve-backend"
version = "0.1.0"
description = "FastAPI backend for the ForgettingCurve local research MVP."
readme = "../README.md"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.18.5",
    "fastapi",
    "httpx",
    "numpy",
    "pydantic",
    "scipy",
    "sqlalchemy",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
